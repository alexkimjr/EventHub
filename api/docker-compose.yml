version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - '2181:2181'
    networks:
      - eventhub-net

  kafka:
    image: bitnami/kafka:3
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_LISTENERS=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    ports:
      - '9092:9092'
    depends_on:
      - zookeeper
    networks:
      - eventhub-net
    volumes:
      - kafka_data:/bitnami/kafka

  api:
    build: .
    environment:
      - RUST_LOG=info
    ports:
      - '8080:8080'
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - kafka
    networks:
      - eventhub-net

networks:
  eventhub-net:

volumes:
  kafka_data:
