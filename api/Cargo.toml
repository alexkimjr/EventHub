[package]
name = "eventhub_api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
serde_yaml = "0.9"
kafka = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-log = "0.1"
log = "0.4"
jsonwebtoken = "8"
argon2 = "0.4"
rand = "0.8"
once_cell = "1.19"
time = "0.3"
password-hash = "0.4"

[dev-dependencies]
tempfile = "3"
ureq = "2"
